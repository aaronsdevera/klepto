name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --manifest-path klepto/Cargo.toml --lib

  vscode:
    name: vscode-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klepto-vscode
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: klepto-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check-types

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit
